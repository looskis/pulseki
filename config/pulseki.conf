# pulseki configuration.
#
# Keys are the command-line options without the leading "--". Command-line
# flags override anything set here. Lines starting with "#" are ignored.
# Homebrew keeps this file across upgrades.

# Address to listen on. Prometheus expects :9101 (node_exporter uses :9100).
# On a laptop that joins untrusted networks, prefer 127.0.0.1:9101 and scrape
# over a tunnel, or firewall the port.
listen = 0.0.0.0:9101

# URL path that serves metrics.
path = /metrics

# Comma-separated collectors to turn off. Run `pulseki --collectors` for the list.
# disable = smc,battery

# Mount points to skip (ICU regex). The default hides APFS system volumes.
# filesystem.mount-points-exclude = ^/(dev|System/Volumes/(VM|Preboot|Update|xarts|iSCPreboot|Hardware))($|/)

# Filesystem types to skip.
# filesystem.fs-types-exclude = ^(autofs|devfs|nullfs|lifs|synthfs)$

# Network interfaces to skip. The default hides Apple's internal virtual interfaces.
# network.device-exclude = ^(gif|stf|anpi|ap|llw|awdl|pktap|XHC)[0-9]*$

# SMC sensors to expose (ICU regex on the four-character key). By default every
# temperature (T*) and power (P*) key with a plausible reading is exported,
# which costs ~30 ms per scrape on Apple silicon. Narrow it to what you graph:
# smc.key-include = ^(TCMb|TCMz|TH0x|PSTR|PDTR)$

# ---------------------------------------------------------------------------
# Push mode (optional). pulseki always serves /metrics for scrapers; setting
# push.url additionally sends every metric to an OTLP/HTTP endpoint on an
# interval. This is how to reach Grafana Cloud, which cannot scrape you.
#
# Grafana Cloud: Connections > Add new connection > "HTTP Metrics", create an
# access-policy token with the metrics:write scope, then use the OTLP gateway
# URL and numeric instance ID it shows. Put the token in its own file:
#   printf '%s\n' 'glc_...' > /opt/homebrew/etc/pulseki.token
#   chmod 600 /opt/homebrew/etc/pulseki.token
#
# push.url = https://otlp-gateway-prod-<region>.grafana.net/otlp/v1/metrics
# push.username = <instance-id>
# push.password-file = /opt/homebrew/etc/pulseki.token
# push.interval = 15
# push.job = macos
# push.instance = mac-mini
